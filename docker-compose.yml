version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mhras-postgres
    environment:
      POSTGRES_DB: mhras
      POSTGRES_USER: mhras_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mhras_dev_password_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mhras_user -d mhras"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhras-network

  # MHRAS API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mhras-api
    environment:
      # Database configuration
      DATABASE_URL: postgresql://mhras_user:${DB_PASSWORD:-mhras_dev_password_2024}@postgres:5432/mhras

      # Security
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:-dev-secret-key-change-in-production}
      ENVIRONMENT: ${ENVIRONMENT:-development}

      # Application settings
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mhras-network

volumes:
  postgres_data:
    driver: local

networks:
  mhras-network:
    driver: bridge
