<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Data Science | Batch Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230c1417'/><path d='M5 16h4l3-8 4 16 3-8h8' fill='none' stroke='%232dd4bf' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body class="dark" data-page="batch">
    <div id="app-chrome"></div>

    <template data-chrome-template="page-header">
                <div>
                    <p class="page-kicker">Bulk</p>
                    <h1>Batch Analytics</h1>
                    <p class="page-lead">Run multi-record screening workflows in isolation, then export results.</p>
                </div>
    </template>

    <template data-chrome-template="page-body">

            <section id="auth-section" class="card" aria-label="Authentication">
                <p class="card-kicker">Access</p>
                <h2>Researcher &amp; Practitioner Login</h2>
                <div id="error-display" class="error-message" role="alert" style="display:none;"></div>
                <div id="login-form">
                    <button onclick="googleSignIn()" class="google-btn" type="button">Continue with Google</button>
                    <div class="or-divider">or email login</div>
                    <div class="auth-grid">
                        <div class="form-group">
                            <label for="login-email">Account Email</label>
                            <input type="email" id="login-email" placeholder="user@example.org">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" placeholder="••••••••">
                        </div>
                    </div>
                    <div class="btn-row">
                        <button onclick="firebaseLogin()" class="btn btn-primary">Sign In</button>
                        <button onclick="firebaseRegister()" class="btn btn-secondary">Create account</button>
                    </div>
                </div>
                <div id="user-info" style="display:none;">
                    <p class="signed-in-note">Authenticated as <strong id="user-display-name"></strong></p>
                    <button onclick="firebaseLogout()" class="btn btn-secondary" style="margin-top:12px;">Sign Out</button>
                </div>
            </section>

            <section id="batch-section" class="card" aria-label="Batch Screening">
                <p class="card-kicker">Workflow</p>
                <h2>Batch Analytics</h2>
                <p class="card-lead">Submit multiple records at once (JSON format, max 100). Batch processing uses the same statistical risk model as individual assessments.</p>
                <div class="form-group">
                    <label for="batch-data">Batch Data Array</label>
                    <textarea id="batch-data" rows="8" placeholder='[{"anonymized_id": "patient_001", "consent_verified": true, "survey_data": {"phq9_score": 15, "gad7_score": 12}}]'></textarea>
                    <div class="btn-row">
                        <button onclick="loadSampleBatchData()" class="btn btn-secondary">Load Sample Batch</button>
                        <button onclick="clearBatchData()" class="btn btn-secondary">Clear</button>
                    </div>
                </div>
                <button onclick="submitBatchScreening()" class="btn btn-primary">Run batch analysis</button>
                <div id="batch-results" class="batch-results" style="display: none;"></div>
                <div id="batch-export-section" class="btn-row" style="display: none;">
                    <button onclick="exportBatchResultsCSV()" class="btn btn-secondary">Export CSV</button>
                    <button onclick="exportBatchResultsJSON()" class="btn btn-secondary">Export JSON</button>
                </div>
            </section>

    </template>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="partials/chrome.js"></script>
    <script src="app.js"></script>
</body>
</html>
