<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Data Science | Screening</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230c1417'/><path d='M5 16h4l3-8 4 16 3-8h8' fill='none' stroke='%232dd4bf' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body class="dark" data-page="screening">
    <div id="app-chrome"></div>

    <template data-chrome-template="page-header">
                <div>
                    <p class="page-kicker">Screening</p>
                    <h1>Assessment Data Entry</h1>
                    <p class="page-lead">Enter PHQ-9, GAD-7, and wearable metrics for a user-isolated risk assessment.</p>
                </div>
    </template>

    <template data-chrome-template="page-body">

            <section id="auth-section" class="card" aria-label="Authentication">
                <p class="card-kicker">Access</p>
                <h2>Researcher &amp; Practitioner Login</h2>
                <div id="error-display" class="error-message" role="alert" style="display:none;"></div>
                <div id="login-form">
                    <button onclick="googleSignIn()" class="google-btn" type="button">Continue with Google</button>
                    <div class="or-divider">or email login</div>
                    <div class="auth-grid">
                        <div class="form-group">
                            <label for="login-email">Account Email</label>
                            <input type="email" id="login-email" placeholder="user@example.org">
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" placeholder="••••••••">
                        </div>
                    </div>
                    <div class="btn-row">
                        <button onclick="firebaseLogin()" class="btn btn-primary">Sign In</button>
                        <button onclick="firebaseRegister()" class="btn btn-secondary">Create account</button>
                    </div>
                </div>
                <div id="user-info" style="display:none;">
                    <p class="signed-in-note">Authenticated as <strong id="user-display-name"></strong></p>
                    <button onclick="firebaseLogout()" class="btn btn-secondary" style="margin-top:12px;">Sign Out</button>
                </div>
            </section>

            <section id="screening-section" class="card" aria-label="Patient Screening">
                <p class="card-kicker">Assessment</p>
                <h2>Assessment Data Entry</h2>
                <div class="form-group">
                    <label for="anonymized-id">Anonymized Identifier</label>
                    <input type="text" id="anonymized-id" placeholder="e.g., patient_98412" required>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="consent-verified" required>
                        <span>Data Protection &amp; Privacy Consent Verified</span>
                    </label>
                </div>
                <div class="form-panel-grid">
                    <div class="form-panel">
                        <h3>Survey Assessments</h3>
                        <div class="form-group">
                            <label for="phq9-score">PHQ-9 Score (Depression)</label>
                            <input type="number" id="phq9-score" min="0" max="27" placeholder="0-27">
                        </div>
                        <div class="form-group">
                            <label for="gad7-score">GAD-7 Score (Anxiety)</label>
                            <input type="number" id="gad7-score" min="0" max="21" placeholder="0-21">
                        </div>
                    </div>
                    <div class="form-panel">
                        <h3>Biometric Wearable Metrics</h3>
                        <div class="form-group">
                            <label for="avg-heart-rate">Resting Heart Rate (bpm)</label>
                            <input type="number" id="avg-heart-rate" min="40" max="200" placeholder="e.g. 74">
                        </div>
                        <div class="form-group">
                            <label for="sleep-hours">Average Sleep (Hours)</label>
                            <input type="number" id="sleep-hours" min="0" max="24" step="0.5" placeholder="e.g. 6.5">
                        </div>
                    </div>
                </div>
                <div class="btn-row">
                    <button onclick="submitScreening()" class="btn btn-primary">Run assessment</button>
                    <button onclick="loadSampleScreeningData()" class="btn btn-secondary">Load sample data</button>
                </div>
            </section>

            <section id="results-section" class="card" style="display:none;" aria-label="Assessment Results">
                <div class="card-header">
                    <div>
                        <p class="card-kicker">Results</p>
                        <h2>Assessment Results &amp; Intelligence</h2>
                        <p class="card-lead">Real-time risk scoring, feature attribution, and predictive modeling analytics.</p>
                    </div>
                    <span id="risk-badge" class="badge">--</span>
                </div>
                <div id="risk-score-display" class="results-grid">
                    <div class="results-panel results-panel--center">
                        <span class="panel-label">Calculated Risk Profile</span>
                        <div class="risk-score-value">
                            <span id="score-value">--</span><span class="score-unit"> / 100</span>
                        </div>
                        <div class="confidence">
                            Model Confidence: <strong id="confidence-value">--</strong>%
                        </div>
                    </div>
                    <div class="results-panel">
                        <span class="panel-label">Feature Contribution Breakdown</span>
                        <div id="force-plot" style="min-height: 180px; position: relative;"></div>
                    </div>
                    <div class="results-panel">
                        <span class="panel-label">Risk Gauge</span>
                        <div id="risk-gauge" style="min-height: 180px;"></div>
                    </div>
                </div>
                <div id="trend-container" style="margin-bottom: 24px;"></div>
                <div id="alerts-display"></div>
                <div class="results-cols">
                    <div>
                        <h3>Contributing Factors</h3>
                        <ul id="factors-list" class="feature-list"></ul>
                    </div>
                    <div>
                        <h3>Recommendations</h3>
                        <div id="recommendations-list" class="recommendation-list"></div>
                    </div>
                    <div>
                        <h3>Model Explanations</h3>
                        <div id="explanations-content"></div>
                    </div>
                </div>
            </section>

    </template>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="partials/chrome.js"></script>
    <script src="app.js"></script>
</body>
</html>
